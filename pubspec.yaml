name: babytime
description: "BabyTime: AI sleep prediction, diet advice, shoe helper and photo memories."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.5
  dio: ^5.8.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  intl: ^0.20.2
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/changelog.json